<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$name - Resume</title>
  <style>
$styles
  </style>
</head>
<body>
  <main>
    <header>
      <h1>$name</h1>
      <p class="contact">$contact</p>
    </header>
    <p class="summary">$summary</p>
    <section>
      <h2>$experience_heading</h2>
      <article class="current">
        $current
      </article>
      <p class="earlier-note">$earlier_note</p>
      <div class="earlier">
        $earlier
      </div>
    </section>
    <section class="publications">
      <h2>$publications_heading</h2>
      <ul>$publications</ul>
    </section>
    <section class="education">
      <h2>$education_heading</h2>
      <p>$education_description</p>
    </section>
  </main>
</body>
</html>
